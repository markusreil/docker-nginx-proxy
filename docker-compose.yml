name: web-proxy
services:
  nginx:
    build:
      context: ./nginx
      args:
        NGINX_PROXY_VERSION: ${NGINX_PROXY_VERSION:?NGINX_PROXY_VERSION must be defined in .env}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    ports:
      - "80:80"
    expose:
      - "8080"
    labels:
      homepage.group: Infrastructure
      homepage.name: nginx-proxy
      homepage.icon: si-nginx
      homepage.description: Reverse proxy
      homepage.weight: -100
      homepage.showStats: true
      homepage.siteMonitor: http://nginx:8080/stub_status
      com.github.nginx-proxy.nginx: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - html:/usr/share/nginx/html
      - vhostd:/etc/nginx/vhost.d
    networks:
      - web-proxy
  maxbody:
    build:
      context: ./maxbody
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    labels:
      homepage.group: Infrastructure
      homepage.name: maxbody
      homepage.icon: si-nginx
      homepage.description: Per-vhost upload limit writer
      homepage.weight: -85
      homepage.showStats: true
    volumes:
      - vhostd:/vhostd
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: none

networks:
  web-proxy:
    name: ${NGINX_PROXY_NETWORK:-web-proxy}

volumes:
  html:
  vhostd:
