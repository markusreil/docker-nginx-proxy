name: web-proxy
services:
  nginx:
    build:
      context: ./nginx
      args:
        NGINX_PROXY_VERSION: ${NGINX_PROXY_VERSION:-alpine}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      # No CDN/LB in front of this proxy: don't trust X-Forwarded-For from
      # clients (prevents IP spoofing in logs and IP-based rules).
      TRUST_DOWNSTREAM_PROXY: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/stub_status"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    ports:
      - "80:80"
    expose:
      - "8080"
    labels:
      homepage.group: Infrastructure
      homepage.name: proxy-nginx
      homepage.icon: si-nginx
      homepage.description: Reverse proxy
      homepage.weight: -100
      homepage.showStats: true
      homepage.siteMonitor: http://nginx:8080/stub_status
      com.github.nginx-proxy.nginx: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - html:/usr/share/nginx/html
      - vhostd:/etc/nginx/vhost.d
    networks:
      - web-proxy
  maxbody:
    build:
      context: ./maxbody
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    labels:
      homepage.group: Infrastructure
      homepage.name: proxy-maxbody
      homepage.icon: si-nginx
      homepage.description: Per-vhost upload limit writer
      homepage.weight: -85
      homepage.showStats: true
    healthcheck:
      test: ["CMD-SHELL", "[ -f /vhostd/.maxbody.ready ]"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    volumes:
      - vhostd:/vhostd
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: none

networks:
  web-proxy:
    name: ${NGINX_PROXY_NETWORK:-web-proxy}

volumes:
  html:
  vhostd:
