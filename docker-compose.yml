name: nginx-proxy
services:
  certgen:
    build: ./certgen
    container_name: certgen
    env_file:
      - .env
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be defined in .env}
      CERT_DAYS: ${CERT_DAYS:?CERT_DAYS must be defined in .env}
    volumes:
      - certs:/certs
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
    networks:
      - web-proxy
    depends_on:
      certgen:
        condition: service_completed_successfully

networks:
  web-proxy:
    name: web-proxy

volumes:
  certs:
