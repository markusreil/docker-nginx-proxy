name: web-proxy
services:
  certgen:
    build: ./certgen
    env_file:
      - .env
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN must be defined in .env}
      CERT_DAYS: ${CERT_DAYS:?CERT_DAYS must be defined in .env}
    volumes:
      - certs:/certs
  nginx:
    image: nginxproxy/nginx-proxy:1.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    labels:
      homepage.group: Infrastructure
      homepage.name: nginx-proxy
      homepage.icon: si-nginx
      homepage.description: Reverse proxy
      homepage.weight: -100
      homepage.showStats: true
      homepage.siteMonitor: http://nginx:8080/stub_status
      com.github.nginx-proxy.nginx: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
      - html:/usr/share/nginx/html
      - ./vhost.d:/etc/nginx/vhost.d:ro
      - ./conf.d/global-upload-limit.conf:/etc/nginx/conf.d/global-upload-limit.conf:ro
    networks:
      - web-proxy
    depends_on:
      certgen:
        condition: service_completed_successfully
  acme-companion:
    image: nginxproxy/acme-companion:2.8
    restart: unless-stopped
    environment:
      DEFAULT_EMAIL: ${LE_EMAIL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - html:/usr/share/nginx/html:rw
      - acme:/etc/acme.sh
    networks:
      - web-proxy

networks:
  web-proxy:
    name: web-proxy

volumes:
  certs:
  html:
  acme:
